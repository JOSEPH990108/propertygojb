services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: pgjb_bootstrap
      POSTGRES_PASSWORD: pgjb_synthetic_bootstrap
      POSTGRES_DB: pgjb_${PGJB_DB_MODE:?}_${PGJB_DB_INSTANCE:?}
    labels:
      com.propertygojb.d1: synthetic
      com.propertygojb.d1.mode: ${PGJB_DB_MODE:?}
      com.propertygojb.d1.instance: ${PGJB_DB_INSTANCE:?}
    ports:
      - "127.0.0.1:${PGJB_DB_PORT:?}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U pgjb_bootstrap -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
