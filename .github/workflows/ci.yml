name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: pgjb_bootstrap
          POSTGRES_PASSWORD: pgjb_synthetic_bootstrap
          POSTGRES_DB: pgjb_test_00000000000040008000000000000001
        ports:
          - "127.0.0.1:55432:5432"
        options: >-
          --label com.propertygojb.d1=synthetic
          --label com.propertygojb.d1.mode=test
          --label com.propertygojb.d1.instance=00000000000040008000000000000001
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U pgjb_bootstrap -d pgjb_test_00000000000040008000000000000001"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install approved npm version
        run: npm install --global npm@11.12.0
      - name: Verify npm version
        run: test "$(npm --version)" = "11.12.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate SDLC control register
        run: npm run sdlc:validate
      - name: Test SDLC controls
        run: npm run test:sdlc
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build application
        run: npm run build
      - name: Check migration history
        run: npm run db:check
      - name: Test database configuration and server boundary
        run: npm run test:db:unit
      - name: Test isolated PostgreSQL foundation and recovery
        env:
          PGJB_DB_MODE: test
          PGJB_DB_INSTANCE: "00000000000040008000000000000001"
          PGJB_DB_PORT: "55432"
          PGJB_DB_CONTAINER: ${{ job.services.postgres.id }}
          PGJB_TEST_REAL_COPILOT: "0"
        run: npm run test:db
